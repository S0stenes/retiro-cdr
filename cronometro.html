<style>
  :root {
    --paper:      #F2F1EC;
    --card:       #FDFCF9;
    --band:       #E4E5DE;
    --line:       #C9C7BF;
    --hairline:   #1A1A1A;
    --ink:        #1E1E1E;
    --ink-soft:   #6A6A63;
    --blue:       #2A20C9;
    --blue-deep:  #1B1490;
  }
  [data-theme="dark"] {
    --paper:      #14151A;
    --card:       #1B1D23;
    --band:       #262931;
    --line:       #3A3D46;
    --hairline:   #3A3D46;
    --ink:        #ECEBE6;
    --ink-soft:   #9A9C9F;
    --blue:       #8E88FF;
    --blue-deep:  #B4AFFF;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    padding: 46px 18px 56px;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(0,0,0,.020) 0 1px, transparent 1px),
      radial-gradient(circle at 72% 46%, rgba(0,0,0,.016) 0 1px, transparent 1px),
      radial-gradient(circle at 40% 82%, rgba(0,0,0,.018) 0 1px, transparent 1px);
    background-size: 130px 130px, 190px 190px, 160px 160px;
    color: var(--ink);
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    transition: background-color .25s, color .25s;
  }

  /* ---------- emojis flutuantes ---------- */
  #sky {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .fly {
    position: absolute;
    bottom: -70px;
    font-size: 26px;
    line-height: 1;
    opacity: 0;
    will-change: transform, opacity;
    animation: subir linear forwards;
  }
  @keyframes subir {
    0%   { opacity: 0;  transform: translate3d(0, 0, 0) rotate(0deg) scale(.85); }
    12%  { opacity: .85; }
    80%  { opacity: .7; }
    100% { opacity: 0;  transform: translate3d(var(--dx), calc(-100vh - 140px), 0) rotate(var(--rot)) scale(1.05); }
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 620px;
    margin: auto;
    text-align: center;
  }

  /* ---------- topo ---------- */
  .brand img { width: 180px; max-width: 56%; height: auto; opacity: .92; }
  [data-theme="dark"] .brand img { filter: invert(1) hue-rotate(180deg) brightness(1.18); opacity: .9; }

  h1 {
    margin: 24px 0 4px;
    font-weight: 300;
    font-size: clamp(28px, 7.6vw, 48px);
    letter-spacing: .13em;
    text-transform: uppercase;
    line-height: 1.05;
  }
  h1 .accent { color: var(--blue); font-weight: 600; }

  .subtitle {
    margin: 0;
    font-weight: 300;
    font-size: clamp(11px, 3vw, 15px);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------- contador ---------- */
  .lead {
    margin: 40px 0 16px;
    font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--ink-soft);
  }

  .clock {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--hairline);
    padding: 26px 10px 22px;
  }
  [data-theme="dark"] .clock { border-color: var(--line); }

  .unit { position: relative; }
  .unit + .unit::before {
    content: ""; position: absolute; left: -4px; top: 12%;
    width: 1px; height: 56%; background: var(--line);
  }
  .unit b {
    display: block;
    font-weight: 300;
    font-size: clamp(34px, 11vw, 60px);
    line-height: 1;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  .unit span {
    display: block; margin-top: 10px;
    font-size: 9.5px; letter-spacing: .19em; text-transform: uppercase;
    color: var(--ink-soft);
  }

  .target {
    margin: 18px 0 0;
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-size: clamp(22px, 5.6vw, 29px);
    color: var(--blue);
    line-height: 1.2;
  }

  /* estado: já começou */
  .clock.started {
    display: block;
    padding: 34px 22px;
  }
  .started-msg {
    font-family: 'Caveat', cursive;
    font-size: clamp(28px, 8vw, 44px);
    color: var(--blue);
    line-height: 1.15;
  }
  .started-sub {
    margin-top: 10px;
    font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------- links ---------- */
  .ig {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 34px;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--hairline);
    color: var(--ink);
    padding: 15px 26px;
    font-size: 11px; letter-spacing: .17em; text-transform: uppercase;
    transition: background .18s, color .18s, border-color .18s;
  }
  [data-theme="dark"] .ig { border-color: var(--line); }
  .ig:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
  [data-theme="dark"] .ig:hover { color: #14151A; }
  .ig svg { width: 17px; height: 17px; flex: 0 0 auto; }

  .links {
    margin-top: 30px;
    display: flex; gap: 10px 26px; justify-content: center; flex-wrap: wrap;
  }
  .links a {
    color: var(--ink-soft); text-decoration: none;
    font-size: 10.5px; letter-spacing: .17em; text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    padding-bottom: 3px;
    transition: color .18s, border-color .18s;
  }
  .links a:hover { color: var(--blue); border-color: var(--blue); }

  .theme-toggle {
    position: fixed; top: 14px; right: 14px; z-index: 3;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer; font-size: 15px; line-height: 1;
    display: grid; place-items: center;
    transition: border-color .18s;
  }
  .theme-toggle:hover { border-color: var(--blue); }

  .foot {
    position: relative; z-index: 1;
    text-align: center; margin: 46px 0 0;
    font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-soft); line-height: 2;
  }

  @media (min-width: 720px) {
    .clock { gap: 14px; padding: 32px 18px 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #sky { display: none; }
    * { animation: none !important; transition: none !important; }
  }

  @media print {
    #sky, .theme-toggle { display: none !important; }
    body { background: #fff; }
  }
</style>

<script>
(function () {
  'use strict';

  /* ====== ALVO DA CONTAGEM ======
     Fuso fixo (-03:00) para o contador bater igual em qualquer aparelho. */
  var ALVO = new Date('2026-08-21T18:00:00-03:00').getTime();
  var FIM  = new Date('2026-08-23T14:00:00-03:00').getTime();
  /* ====== FIM ====== */

  var THEME_KEY = 'retiro-unidos.tema';

  var elD = document.getElementById('d');
  var elH = document.getElementById('h');
  var elM = document.getElementById('m');
  var elS = document.getElementById('s');
  var relogio = document.getElementById('clock');
  var lead = document.getElementById('lead');
  var alvoTxt = document.getElementById('target');

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function plural(n, sing, plur) { return n === 1 ? sing : plur; }

  function encerrar(msg, sub) {
    relogio.className = 'clock started';
    relogio.innerHTML = '';
    var a = document.createElement('div');
    a.className = 'started-msg';
    a.textContent = msg;
    var b = document.createElement('div');
    b.className = 'started-sub';
    b.textContent = sub;
    relogio.appendChild(a);
    relogio.appendChild(b);
    lead.textContent = '';
    alvoTxt.style.display = 'none';
    if (timer) clearInterval(timer);
  }

  function tick() {
    var agora = Date.now();
    var falta = ALVO - agora;

    if (falta <= 0) {
      if (agora < FIM) encerrar('O retiro começou!', 'Aproveite cada momento');
      else encerrar('Até o próximo!', 'Que Deus abençoe a caminhada');
      return;
    }

    var seg = Math.floor(falta / 1000);
    var d = Math.floor(seg / 86400);
    var h = Math.floor((seg % 86400) / 3600);
    var m = Math.floor((seg % 3600) / 60);
    var s = seg % 60;

    elD.textContent = pad(d);
    elH.textContent = pad(h);
    elM.textContent = pad(m);
    elS.textContent = pad(s);

    document.getElementById('ld').textContent = plural(d, 'dia', 'dias');
    document.getElementById('lh').textContent = plural(h, 'hora', 'horas');
    document.getElementById('lm').textContent = plural(m, 'minuto', 'minutos');
    document.getElementById('ls').textContent = plural(s, 'segundo', 'segundos');

    lead.textContent = d > 1 ? 'Faltam' : 'Falta pouco';
  }

  var timer = setInterval(tick, 1000);
  tick();

  /* ---------- emojis flutuantes ---------- */
  var EMOJIS = ['🙏','✨','🕊️','❤️','🎉','🔥','🤝','📖','🎸','⛺','🌿','😊','🌅','🤍','🎶','☀️'];
  var sky = document.getElementById('sky');
  var reduzir = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAX = 16;

  function soltar() {
    if (document.hidden || sky.childElementCount >= MAX) return;

    var el = document.createElement('span');
    el.className = 'fly';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

    var dur = 12 + Math.random() * 8;
    el.style.left = (Math.random() * 92 + 2) + '%';
    el.style.fontSize = (20 + Math.random() * 18) + 'px';
    el.style.animationDuration = dur + 's';
    el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    el.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');

    el.addEventListener('animationend', function () { el.remove(); });
    sky.appendChild(el);
  }

  if (!reduzir) {
    for (var i = 0; i < 6; i++) setTimeout(soltar, i * 700);
    setInterval(soltar, 1100);
  }

  /* ---------- tema ---------- */
  var btn = document.getElementById('themeBtn');

  function aplicarTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  var temaSalvo = null;
  try { temaSalvo = localStorage.getItem(THEME_KEY); } catch (e) {}
  aplicarTema(temaSalvo || (window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  btn.addEventListener('click', function () {
    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
