<style>
  :root {
    --paper:      #F2F1EC;
    --card:       #FDFCF9;
    --band:       #E4E5DE;
    --line:       #C9C7BF;
    --hairline:   #1A1A1A;
    --ink:        #1E1E1E;
    --ink-soft:   #6A6A63;
    --blue:       #2A20C9;
    --blue-deep:  #1B1490;
    --check:      #2A20C9;
  }
  [data-theme="dark"] {
    --paper:      #14151A;
    --card:       #1B1D23;
    --band:       #262931;
    --line:       #3A3D46;
    --hairline:   #3A3D46;
    --ink:        #ECEBE6;
    --ink-soft:   #9A9C9F;
    --blue:       #8E88FF;
    --blue-deep:  #B4AFFF;
    --check:      #8E88FF;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: clamp(28px, 5vw, 64px) 18px 120px;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(0,0,0,.020) 0 1px, transparent 1px),
      radial-gradient(circle at 72% 46%, rgba(0,0,0,.016) 0 1px, transparent 1px),
      radial-gradient(circle at 40% 82%, rgba(0,0,0,.018) 0 1px, transparent 1px);
    background-size: 130px 130px, 190px 190px, 160px 160px;
    color: var(--ink);
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background-color .25s, color .25s;
  }

  .wrap {
    width: 100%;
    max-width: 600px;
    margin-inline: auto;
  }

  /* ---------- topo ---------- */
  .brand { text-align: center; margin-bottom: 30px; }
  .brand img {
    width: 190px; max-width: 62%; height: auto;
    opacity: .92;
  }
  [data-theme="dark"] .brand img { filter: invert(1) hue-rotate(180deg) brightness(1.18); opacity: .9; }

  h1 {
    margin: 26px 0 4px;
    font-weight: 300;
    font-size: clamp(30px, 8.2vw, 52px);
    letter-spacing: .13em;
    text-transform: uppercase;
    line-height: 1.05;
  }
  h1 .accent { color: var(--blue); font-weight: 600; }

  .subtitle {
    margin: 0;
    font-weight: 300;
    font-size: clamp(13px, 3.5vw, 21px);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------- progresso ---------- */
  .progress {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 34px auto 26px;
    max-width: 440px;
    padding: 13px 0 11px;
    background: var(--paper);
  }
  .progress::before {
    content: "";
    position: absolute;
    left: 50%; top: 0;
    width: 100vw; height: 100%;
    transform: translateX(-50%);
    background: var(--paper);
    z-index: -1;
  }
  .progress-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-soft); margin-bottom: 9px;
  }
  .progress-top b { color: var(--blue); font-weight: 600; font-size: 13px; }
  .bar {
    height: 3px; background: var(--line); position: relative; overflow: hidden;
  }
  .bar > i {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: var(--blue); transition: width .45s cubic-bezier(.22,.7,.3,1);
  }

  /* ---------- seções ---------- */
  .section {
    background: var(--card);
    border: 1px solid var(--hairline);
    margin-bottom: 28px;
  }
  [data-theme="dark"] .section { border-color: var(--line); }

  .section-head {
    background: var(--band);
    border-bottom: 1px solid var(--hairline);
    padding: 17px 16px;
    text-align: center;
    position: relative;
  }
  [data-theme="dark"] .section-head { border-bottom-color: var(--line); }
  .section-head h2 {
    margin: 0;
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 600;
    letter-spacing: .21em;
    text-transform: uppercase;
  }
  .section-head .sec-count {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-size: 11px; letter-spacing: .08em; color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .list { list-style: none; margin: 0; padding: 16px 20px 22px; }

  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 4px 0 9px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 9px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .item:last-child { margin-bottom: 0; }

  .item input { position: absolute; opacity: 0; pointer-events: none; }

  .box {
    flex: 0 0 auto;
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--hairline);
    background: transparent;
    position: relative;
    transition: border-color .18s, background .18s, transform .12s;
  }
  [data-theme="dark"] .box { border-color: var(--line); }
  .item:hover .box { border-color: var(--blue); }
  .item:active .box { transform: scale(.9); }

  .box::after {
    content: "";
    position: absolute; left: 8.5px; top: 4px;
    width: 6px; height: 12px;
    border: solid var(--check); border-width: 0 2.2px 2.2px 0;
    transform: rotate(43deg) scale(0);
    transform-origin: center;
    transition: transform .18s cubic-bezier(.3,1.5,.5,1);
  }
  .item.done .box { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 8%, transparent); }
  .item.done .box::after { transform: rotate(43deg) scale(1); }

  .label {
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-size: clamp(21px, 5.4vw, 27px);
    font-weight: 500;
    line-height: 1.15;
    color: var(--blue);
    padding-top: 3px;
    transition: opacity .2s;
  }
  .item.done .label { opacity: .42; text-decoration: line-through; text-decoration-thickness: 1.2px; }

  .note {
    font-family: 'Jost', sans-serif;
    font-size: .58em;
    letter-spacing: .04em;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  /* ---------- rodapé ---------- */
  .actions {
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    margin-top: 34px;
  }
  .btn {
    font-family: 'Jost', sans-serif;
    font-size: 11px; letter-spacing: .17em; text-transform: uppercase;
    padding: 13px 24px;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink);
    cursor: pointer;
    transition: background .18s, color .18s, border-color .18s;
  }
  [data-theme="dark"] .btn { border-color: var(--line); }
  .btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
  [data-theme="dark"] .btn:hover { color: #14151A; }
  .btn[disabled] { opacity: .45; cursor: progress; pointer-events: none; }

  .theme-toggle {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer; font-size: 15px; line-height: 1;
    display: grid; place-items: center;
    transition: border-color .18s;
  }
  .theme-toggle:hover { border-color: var(--blue); }

  .foot {
    text-align: center; margin-top: 30px;
    font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-soft); line-height: 2;
  }

  /* ---------- comemoração ---------- */
  .done-banner {
    max-width: 440px; margin: 0 auto 26px;
    border: 1px solid var(--blue);
    padding: 15px 18px; text-align: center;
    font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--blue);
    display: none;
  }
  .done-banner.show { display: block; animation: pop .35s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }

  /* ---------- estado temporário durante a geração do PDF ---------- */
  body.exporting {
    background: #fff !important;
    background-image: none !important;
  }
  body.exporting .theme-toggle,
  body.exporting .actions,
  body.exporting .progress,
  body.exporting .done-banner { display: none !important; }
  body.exporting .section { margin-bottom: 20px; }
  /* marca sólida: mais confiável que a rotação no rasterizador */
  body.exporting .item.done .box {
    background: var(--blue);
    border-color: var(--blue);
  }
  body.exporting .item.done .box::after { display: none; }
  body.exporting .item.done .box::before {
    content: "\2713";
    position: absolute; inset: 0;
    color: #fff; font-family: 'Jost', sans-serif; font-size: 15px;
    line-height: 23px; text-align: center;
  }

  /* telas largas: mais respiro, sem esticar a coluna */
  @media (min-width: 900px) {
    .brand img { width: 210px; }
    .section { margin-bottom: 34px; }
    .list { padding: 20px 30px 26px; }
    .item { gap: 16px; padding-bottom: 11px; margin-bottom: 11px; }
  }

  @page { margin: 12mm; }

  @media print {
    /* força o tema claro e mantém fundos/cores na impressão */
    :root, [data-theme="dark"] {
      --paper: #FFFFFF; --card: #FFFFFF; --band: #E4E5DE; --line: #C9C7BF;
      --hairline: #1A1A1A; --ink: #1E1E1E; --ink-soft: #6A6A63;
      --blue: #2A20C9; --check: #2A20C9;
    }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    html, body { background: #fff !important; }
    body { padding: 0; background-image: none !important; }
    .wrap { max-width: 100%; }

    .theme-toggle, .actions, .progress, .done-banner { display: none !important; }
    [data-theme="dark"] .brand img { filter: none !important; }
    [data-theme="dark"] .section,
    [data-theme="dark"] .section-head,
    [data-theme="dark"] .box { border-color: var(--hairline) !important; }

    .brand { margin-bottom: 18px; }
    h1 { margin: 14px 0 4px; }

    /* a seção PODE quebrar entre páginas — evita a folha em branco */
    .section { break-inside: auto; page-break-inside: auto; margin-bottom: 16px; }
    .section-head { break-after: avoid; page-break-after: avoid; }
    .list { break-inside: auto; page-break-inside: auto; }

    /* só o item individual não se parte ao meio */
    .item { break-inside: avoid; page-break-inside: avoid; }

    .foot { margin-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

    <h1>Retiro <span class="accent">Unidos</span></h1>
    <p class="subtitle">Checklist da viagem</p>
  </div>

  <div class="progress">
    <div class="progress-top">
      <span>Progresso</span>
      <span><b id="pct">0%</b> &nbsp;·&nbsp; <span id="counts">0 / 0</span></span>
    </div>
    <div class="bar"><i id="fill"></i></div>
  </div>

  <div class="done-banner" id="banner">Tudo pronto — boa viagem! ✦</div>

  <div id="app"></div>

  <div class="actions">
    <button class="btn" id="reset">Desmarcar tudo</button>
    <button class="btn" id="pdf">Gerar PDF</button>
    <button class="btn" id="print">Imprimir</button>
  </div>

  <p class="foot">
    Unidos · Comunidade do Reino<br>
    As marcações ficam salvas neste navegador
  </p>

<script>
(function () {
  'use strict';

  /* ====== CONTEÚDO DO CHECKLIST ======
     Para editar a lista, altere apenas este bloco.
     Se mudar itens, suba o número da VERSAO para resetar as marcações antigas. */
  var VERSAO = 1;

  var CHECKLIST = [
    {
      titulo: 'Itens pessoais',
      itens: [
        'Bíblia',
        'Roupas confortáveis',
        'Roupa que possa sujar / molhar',
        'Agasalhos',
        'Chinelo',
        'Lençol, cobertor e travesseiro',
        'Escova e pasta de dente',
        'Sabonete, shampoo e condicionador',
        'Toalha de banho',
        'Desodorante',
        'Repelente',
        'Medicamentos pessoais',
        { texto: 'Barraca', nota: '(só para os homens)' },
        { texto: 'Talheres', nota: '(garfo e faca ou colher)' }
      ]
    },
    {
      titulo: 'Opcionais',
      itens: [
        { texto: 'Jogos', nota: '(cartas, tabuleiro, etc)' },
        'Protetor solar',
        'Roupa de banho para a lagoa',
        'Garrafa de água',
        'Doces, biscoitos e guloseimas'
      ]
    }
  ];
  /* ====== FIM DO CONTEÚDO ====== */

  var KEY = 'retiro-unidos.v' + VERSAO;
  var THEME_KEY = 'retiro-unidos.tema';

  var marcados = carregar();

  var app     = document.getElementById('app');
  var elPct   = document.getElementById('pct');
  var elCount = document.getElementById('counts');
  var elFill  = document.getElementById('fill');
  var banner  = document.getElementById('banner');

  function carregar() {
    try {
      var raw = localStorage.getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function salvar() {
    try { localStorage.setItem(KEY, JSON.stringify(marcados)); }
    catch (e) { /* modo privado / storage cheio: segue funcionando na sessão */ }
  }

  function normaliza(it) {
    return typeof it === 'string' ? { texto: it, nota: '' } : { texto: it.texto, nota: it.nota || '' };
  }

  function idDe(s, i) { return 's' + s + 'i' + i; }

  /* ---------- montagem ---------- */
  CHECKLIST.forEach(function (secao, si) {
    var sec = document.createElement('section');
    sec.className = 'section';

    var head = document.createElement('div');
    head.className = 'section-head';
    var h2 = document.createElement('h2');
    h2.textContent = secao.titulo;
    var cnt = document.createElement('span');
    cnt.className = 'sec-count';
    cnt.dataset.sec = si;
    head.appendChild(h2);
    head.appendChild(cnt);
    sec.appendChild(head);

    var ul = document.createElement('ul');
    ul.className = 'list';

    secao.itens.forEach(function (bruto, ii) {
      var item = normaliza(bruto);
      var id = idDe(si, ii);

      var li = document.createElement('li');
      li.className = 'item';
      li.dataset.id = id;

      var input = document.createElement('input');
      input.type = 'checkbox';
      input.id = 'cb-' + id;
      input.checked = marcados.indexOf(id) !== -1;

      var lab = document.createElement('label');
      lab.setAttribute('for', 'cb-' + id);
      lab.style.display = 'contents';

      var box = document.createElement('span');
      box.className = 'box';

      var txt = document.createElement('span');
      txt.className = 'label';
      txt.appendChild(document.createTextNode(item.texto));
      if (item.nota) {
        var n = document.createElement('span');
        n.className = 'note';
        n.textContent = ' ' + item.nota;
        txt.appendChild(n);
      }

      lab.appendChild(box);
      lab.appendChild(txt);
      li.appendChild(input);
      li.appendChild(lab);

      if (input.checked) li.classList.add('done');
      ul.appendChild(li);
    });

    sec.appendChild(ul);
    app.appendChild(sec);
  });

  /* ---------- interação ---------- */
  app.addEventListener('change', function (e) {
    if (e.target.type !== 'checkbox') return;
    var li = e.target.closest('.item');
    var id = li.dataset.id;
    var pos = marcados.indexOf(id);

    if (e.target.checked) {
      if (pos === -1) marcados.push(id);
      li.classList.add('done');
    } else {
      if (pos !== -1) marcados.splice(pos, 1);
      li.classList.remove('done');
    }
    salvar();
    atualizar();
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!marcados.length) return;
    if (!confirm('Desmarcar todos os itens?')) return;
    marcados = [];
    salvar();
    Array.prototype.forEach.call(app.querySelectorAll('.item'), function (li) {
      li.classList.remove('done');
      li.querySelector('input').checked = false;
    });
    atualizar();
  });

  document.getElementById('print').addEventListener('click', function () { window.print(); });

  /* ---------- gerar PDF ---------- */
  var CDN_PDF = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.12.1/html2pdf.bundle.min.js';
  var btnPdf = document.getElementById('pdf');
  var rotuloPdf = btnPdf.textContent;
  var carregandoLib = false;

  function carregarLib(ok, erro) {
    if (window.html2pdf) { ok(); return; }
    if (carregandoLib) return;
    carregandoLib = true;
    var s = document.createElement('script');
    s.src = CDN_PDF;
    s.onload = function () { carregandoLib = false; ok(); };
    s.onerror = function () { carregandoLib = false; erro(); };
    document.head.appendChild(s);
  }

  function encerrarPdf(tema) {
    document.body.classList.remove('exporting');
    if (tema) document.documentElement.setAttribute('data-theme', tema);
    btnPdf.disabled = false;
    btnPdf.textContent = rotuloPdf;
  }

  btnPdf.addEventListener('click', function () {
    btnPdf.disabled = true;
    btnPdf.textContent = 'Gerando…';

    function falhou() {
      encerrarPdf(null);
      alert('Não consegui gerar o PDF automaticamente.\n\nUse o botão "Imprimir" e escolha "Salvar como PDF" no destino da impressão.');
    }

    carregarLib(function () {
      var temaAtual = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', 'light');
      document.body.classList.add('exporting');

      var fontesProntas = (document.fonts && document.fonts.ready)
        ? document.fonts.ready
        : Promise.resolve();

      fontesProntas.then(function () {
        return window.html2pdf().set({
          margin:   [10, 10, 12, 10],
          filename: 'retiro-unidos-checklist.pdf',
          image:    { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: '#FFFFFF',
            windowWidth: 900,
            scrollY: 0
          },
          jsPDF:    { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['.item', '.section-head'] }
        }).from(document.querySelector('.wrap')).save();
      }).then(function () {
        encerrarPdf(temaAtual);
      })['catch'](function () {
        encerrarPdf(temaAtual);
        falhou();
      });
    }, falhou);
  });

  /* ---------- progresso ---------- */
  function atualizar() {
    var total = 0, feitos = 0;

    CHECKLIST.forEach(function (secao, si) {
      var t = secao.itens.length, f = 0;
      for (var i = 0; i < t; i++) if (marcados.indexOf(idDe(si, i)) !== -1) f++;
      total += t; feitos += f;
      var c = app.querySelector('.sec-count[data-sec="' + si + '"]');
      if (c) c.textContent = f + '/' + t;
    });

    var pct = total ? Math.round((feitos / total) * 100) : 0;
    elPct.textContent = pct + '%';
    elCount.textContent = feitos + ' / ' + total;
    elFill.style.width = pct + '%';
    banner.classList.toggle('show', total > 0 && feitos === total);
  }

  /* ---------- tema ---------- */
  var btn = document.getElementById('themeBtn');

  function aplicarTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  var temaSalvo = null;
  try { temaSalvo = localStorage.getItem(THEME_KEY); } catch (e) {}
  aplicarTema(temaSalvo || (window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  btn.addEventListener('click', function () {
    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  atualizar();
})();
</script>
