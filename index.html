<style>
  :root {
    --paper:      #F2F1EC;
    --card:       #FDFCF9;
    --band:       #E4E5DE;
    --line:       #C9C7BF;
    --hairline:   #1A1A1A;
    --ink:        #1E1E1E;
    --ink-soft:   #6A6A63;
    --blue:       #2A20C9;
    --blue-deep:  #1B1490;
  }
  [data-theme="dark"] {
    --paper:      #14151A;
    --card:       #1B1D23;
    --band:       #262931;
    --line:       #3A3D46;
    --hairline:   #3A3D46;
    --ink:        #ECEBE6;
    --ink-soft:   #9A9C9F;
    --blue:       #8E88FF;
    --blue-deep:  #B4AFFF;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: clamp(28px, 5vw, 64px) 18px 120px;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(0,0,0,.020) 0 1px, transparent 1px),
      radial-gradient(circle at 72% 46%, rgba(0,0,0,.016) 0 1px, transparent 1px),
      radial-gradient(circle at 40% 82%, rgba(0,0,0,.018) 0 1px, transparent 1px);
    background-size: 130px 130px, 190px 190px, 160px 160px;
    color: var(--ink);
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: background-color .25s, color .25s;
  }

  .wrap { width: 100%; max-width: 600px; margin-inline: auto; }

  /* ---------- topo ---------- */
  .brand { text-align: center; margin-bottom: 34px; }
  .brand img { width: 190px; max-width: 62%; height: auto; opacity: .92; }
  [data-theme="dark"] .brand img { filter: invert(1) hue-rotate(180deg) brightness(1.18); opacity: .9; }

  h1 {
    margin: 26px 0 4px;
    font-weight: 300;
    font-size: clamp(30px, 8.2vw, 52px);
    letter-spacing: .13em;
    text-transform: uppercase;
    line-height: 1.05;
  }
  h1 .accent { color: var(--blue); font-weight: 600; }

  .subtitle {
    margin: 0;
    font-weight: 300;
    font-size: clamp(13px, 3.5vw, 21px);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .dates {
    margin: 14px 0 0;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--blue); font-weight: 500;
  }

  /* ---------- seções (dias) ---------- */
  .section { background: var(--card); border: 1px solid var(--hairline); margin-bottom: 28px; }
  [data-theme="dark"] .section { border-color: var(--line); }

  .section-head {
    background: var(--band);
    border-bottom: 1px solid var(--hairline);
    padding: 17px 16px;
    text-align: center;
  }
  [data-theme="dark"] .section-head { border-bottom-color: var(--line); }
  .section-head h2 {
    margin: 0;
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 600;
    letter-spacing: .21em;
    text-transform: uppercase;
  }
  .section-head .sec-date {
    display: block;
    margin-top: 7px;
    font-size: 11px; font-weight: 400;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
  }
  .section-head .sec-date::before,
  .section-head .sec-date::after {
    content: ""; display: inline-block;
    width: 16px; height: 1px; background: var(--line);
    vertical-align: middle; margin: 0 10px 2px;
  }

  .list { list-style: none; margin: 0; padding: 18px 20px 24px; }

  .ev {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 14px;
    padding: 4px 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 12px;
  }
  .ev:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 2px; }

  .time {
    font-size: 12.5px; font-weight: 500; letter-spacing: .04em;
    color: var(--ink); padding-top: 7px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .time span { display: block; font-weight: 300; color: var(--ink-soft); font-size: 11px; }

  .title {
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-size: clamp(21px, 5.4vw, 27px);
    font-weight: 500; line-height: 1.15;
    color: var(--blue); padding-top: 3px;
  }
  .tag {
    display: inline-block; vertical-align: middle;
    font-family: 'Jost', sans-serif; font-size: 9px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--blue); border: 1px solid var(--blue);
    padding: 3px 7px 2px; margin-left: 8px; opacity: .75;
  }

  .escala { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .escala div {
    font-size: 11px; letter-spacing: .08em; color: var(--ink-soft);
    text-transform: uppercase;
  }
  .escala b { color: var(--ink); font-weight: 500; letter-spacing: .04em; }

  /* ---------- link para o checklist ---------- */
  .cta {
    display: block; text-align: center; text-decoration: none;
    background: var(--card); border: 1px solid var(--hairline);
    padding: 22px 18px; margin-bottom: 28px;
    transition: border-color .18s;
  }
  [data-theme="dark"] .cta { border-color: var(--line); }
  .cta:hover { border-color: var(--blue); }
  .cta .k {
    display: block; font-size: 10px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px;
  }
  .cta .v {
    font-family: 'Caveat', cursive; font-size: clamp(23px, 6vw, 29px);
    color: var(--blue); line-height: 1.1;
  }
  .cta .arrow { font-family: 'Jost', sans-serif; font-size: .62em; margin-left: 6px; }

  /* ---------- aviso offline ---------- */
  .offline-tip {
    border: 1px solid var(--line);
    padding: 14px 16px; margin-bottom: 26px;
    font-size: 11px; letter-spacing: .1em; line-height: 1.9;
    text-transform: uppercase; color: var(--ink-soft); text-align: center;
  }
  .offline-tip b { color: var(--blue); font-weight: 500; }

  /* ---------- rodapé ---------- */
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 34px; }
  .btn {
    font-family: 'Jost', sans-serif;
    font-size: 11px; letter-spacing: .17em; text-transform: uppercase;
    padding: 13px 24px;
    background: transparent; border: 1px solid var(--hairline);
    color: var(--ink); cursor: pointer; text-decoration: none;
    transition: background .18s, color .18s, border-color .18s;
  }
  [data-theme="dark"] .btn { border-color: var(--line); }
  .btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
  [data-theme="dark"] .btn:hover { color: #14151A; }
  .btn[disabled] { opacity: .45; cursor: progress; pointer-events: none; }


  /* ---------- contagem regressiva (link) ---------- */
  .countdown {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--hairline);
    padding: 18px 14px 15px; margin-bottom: 28px;
    text-align: center;
    transition: border-color .18s;
  }
  [data-theme="dark"] .countdown { border-color: var(--line); }
  .countdown:hover { border-color: var(--blue); }
  .countdown .cd-k {
    display: block; margin-bottom: 12px;
    font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cd-u { position: relative; }
  .cd-u + .cd-u::before {
    content: ""; position: absolute; left: -3px; top: 14%;
    width: 1px; height: 52%; background: var(--line);
  }
  .cd-u b {
    display: block; font-weight: 300;
    font-size: clamp(24px, 7.4vw, 34px); line-height: 1;
    color: var(--blue); font-variant-numeric: tabular-nums;
  }
  .cd-u span {
    display: block; margin-top: 7px;
    font-size: 8.5px; letter-spacing: .17em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .countdown .cd-go {
    display: block; margin-top: 13px;
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--blue);
  }
  .countdown.started .cd-grid { display: none; }
  .countdown .cd-msg { display: none; }
  .countdown.started .cd-msg {
    display: block;
    font-family: 'Caveat', 'Segoe Script', cursive;
    font-size: clamp(24px, 6.4vw, 32px); color: var(--blue); line-height: 1.15;
  }


  /* ---------- emojis flutuantes ---------- */
  #sky {
    position: fixed; inset: 0;
    pointer-events: none; overflow: hidden;
    z-index: 0;
  }
  .fly {
    position: absolute; bottom: -70px;
    font-size: 24px; line-height: 1; opacity: 0;
    will-change: transform, opacity;
    animation: subir linear forwards;
  }
  @keyframes subir {
    0%   { opacity: 0;   transform: translate3d(0, 0, 0) rotate(0deg) scale(.85); }
    12%  { opacity: .55; }
    80%  { opacity: .45; }
    100% { opacity: 0;   transform: translate3d(var(--dx), calc(-100vh - 140px), 0) rotate(var(--rot)) scale(1.05); }
  }
  .wrap { position: relative; z-index: 1; }

  .theme-toggle {
    position: fixed; top: 14px; right: 14px; z-index: 10;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer; font-size: 15px; line-height: 1;
    display: grid; place-items: center;
    transition: border-color .18s;
  }
  .theme-toggle:hover { border-color: var(--blue); }

  .foot {
    text-align: center; margin-top: 30px;
    font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-soft); line-height: 2;
  }

  /* ---------- estado temporário durante a geração do PDF ---------- */
  body.exporting {
    background: #fff !important;
    background-image: none !important;
  }
  body.exporting #sky,
  body.exporting .countdown,
  body.exporting .theme-toggle,
  body.exporting .actions,
  body.exporting .offline-tip,
  body.exporting .cta { display: none !important; }
  body.exporting .section { margin-bottom: 20px; }

  @media (min-width: 900px) {
    .brand img { width: 210px; }
    .section { margin-bottom: 34px; }
    .list { padding: 22px 30px 28px; }
  }

  @page { margin: 12mm; }

  @media print {
    /* força o tema claro e mantém fundos/cores na impressão */
    :root, [data-theme="dark"] {
      --paper: #FFFFFF; --card: #FFFFFF; --band: #E4E5DE; --line: #C9C7BF;
      --hairline: #1A1A1A; --ink: #1E1E1E; --ink-soft: #6A6A63; --blue: #2A20C9;
    }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    html, body { background: #fff !important; }
    body { padding: 0; background-image: none !important; }
    .wrap { max-width: 100%; }

    #sky, .countdown, .theme-toggle, .actions, .offline-tip, .cta { display: none !important; }
    [data-theme="dark"] .brand img { filter: none !important; }
    [data-theme="dark"] .section,
    [data-theme="dark"] .section-head { border-color: var(--hairline) !important; }

    .brand { margin-bottom: 18px; }
    h1 { margin: 14px 0 4px; }

    .section { break-inside: auto; page-break-inside: auto; margin-bottom: 16px; }
    .section-head { break-after: avoid; page-break-after: avoid; }
    .list { break-inside: auto; page-break-inside: auto; }
    .ev { break-inside: avoid; page-break-inside: avoid; }

    .foot { margin-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
(function () {
  'use strict';

  /* ====== CONTEÚDO DO CRONOGRAMA ======
     Para editar, altere apenas este bloco. */

  var RETIRO = { rotulo: '21 a 23 de agosto · 2026' };

  var DIAS = [
    {
      titulo: 'Sexta à noite',
      data: 'Sexta-feira · 21 de agosto',
      eventos: [
        { ini: '20h30', fim: '21h30', titulo: 'Jantar' },
        { ini: '21h30', titulo: 'Louvor e oração no deck', tag: 'Deck',
          escala: [['Palavra', 'Gabriela']] }
      ]
    },
    {
      titulo: 'Sábado de manhã',
      data: 'Sábado · 22 de agosto',
      eventos: [
        { ini: '07h30', fim: '09h30', titulo: 'Café da manhã' },
        { ini: '10h00', titulo: 'Culto da manhã', tag: 'Culto',
          escala: [['Abertura', 'Sara'], ['Palavra', 'Victor']] },
        { ini: '12h30', fim: '13h30', titulo: 'Almoço' }
      ]
    },
    {
      titulo: 'Sábado de tarde',
      data: 'Sábado · 22 de agosto',
      eventos: [
        { ini: '15h00', fim: '16h30', titulo: 'Gincana' },
        { ini: '16h30', fim: '17h15', titulo: 'Café da tarde' }
      ]
    },
    {
      titulo: 'Sábado à noite',
      data: 'Sábado · 22 de agosto',
      eventos: [
        { ini: '20h00', fim: '21h00', titulo: 'Jantar' },
        { ini: '21h20', titulo: 'Culto da noite', tag: 'Culto',
          escala: [['Abertura', 'Sóstenes'], ['Palavra', 'Daniel']] }
      ]
    },
    {
      titulo: 'Domingo de manhã',
      data: 'Domingo · 23 de agosto',
      eventos: [
        { ini: '07h30', fim: '09h30', titulo: 'Café da manhã' },
        { ini: '10h00', titulo: 'Culto da manhã', tag: 'Culto',
          escala: [['Abertura', 'Umberto'], ['Palavra', 'Pr. Edelson']] },
        { ini: '12h30', fim: '13h30', titulo: 'Almoço' }
      ]
    }
  ];
  /* ====== FIM DO CONTEÚDO ====== */

  var THEME_KEY = 'retiro-unidos.tema';
  var app = document.getElementById('app');

  document.getElementById('datesLabel').textContent = RETIRO.rotulo;

  /* ---------- montagem ---------- */
  DIAS.forEach(function (dia) {
    var sec = document.createElement('section');
    sec.className = 'section';

    var head = document.createElement('div');
    head.className = 'section-head';
    var h2 = document.createElement('h2');
    h2.textContent = dia.titulo;
    var dt = document.createElement('span');
    dt.className = 'sec-date';
    dt.textContent = dia.data;
    head.appendChild(h2);
    head.appendChild(dt);
    sec.appendChild(head);

    var ul = document.createElement('ul');
    ul.className = 'list';

    dia.eventos.forEach(function (ev) {
      var li = document.createElement('li');
      li.className = 'ev';

      var t = document.createElement('div');
      t.className = 'time';
      t.appendChild(document.createTextNode(ev.ini));
      if (ev.fim) {
        var sub = document.createElement('span');
        sub.textContent = 'até ' + ev.fim;
        t.appendChild(sub);
      }

      var body = document.createElement('div');

      var ti = document.createElement('div');
      ti.className = 'title';
      ti.appendChild(document.createTextNode(ev.titulo));
      if (ev.tag) {
        var tg = document.createElement('span');
        tg.className = 'tag';
        tg.textContent = ev.tag;
        ti.appendChild(tg);
      }
      body.appendChild(ti);

      if (ev.escala && ev.escala.length) {
        var box = document.createElement('div');
        box.className = 'escala';
        ev.escala.forEach(function (par) {
          var d = document.createElement('div');
          d.appendChild(document.createTextNode(par[0] + ': '));
          var b = document.createElement('b');
          b.textContent = par[1];
          d.appendChild(b);
          box.appendChild(d);
        });
        body.appendChild(box);
      }

      li.appendChild(t);
      li.appendChild(body);
      ul.appendChild(li);
    });

    sec.appendChild(ul);
    app.appendChild(sec);
  });

  /* ---------- imprimir ---------- */
  document.getElementById('print').addEventListener('click', function () { window.print(); });

  /* ---------- gerar PDF ---------- */
  var CDN_PDF = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.12.1/html2pdf.bundle.min.js';
  var btnPdf = document.getElementById('pdf');
  var rotuloPdf = btnPdf.textContent;
  var carregandoLib = false;

  function carregarLib(ok, erro) {
    if (window.html2pdf) { ok(); return; }
    if (carregandoLib) return;
    carregandoLib = true;
    var s = document.createElement('script');
    s.src = CDN_PDF;
    s.onload = function () { carregandoLib = false; ok(); };
    s.onerror = function () { carregandoLib = false; erro(); };
    document.head.appendChild(s);
  }

  function encerrarPdf(tema) {
    document.body.classList.remove('exporting');
    if (tema) document.documentElement.setAttribute('data-theme', tema);
    btnPdf.disabled = false;
    btnPdf.textContent = rotuloPdf;
  }

  btnPdf.addEventListener('click', function () {
    btnPdf.disabled = true;
    btnPdf.textContent = 'Gerando…';

    function falhou() {
      encerrarPdf(null);
      alert('Não consegui gerar o PDF automaticamente.\n\nUse o botão "Imprimir" e escolha "Salvar como PDF" no destino da impressão.');
    }

    carregarLib(function () {
      var temaAtual = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', 'light');
      document.body.classList.add('exporting');

      var fontesProntas = (document.fonts && document.fonts.ready)
        ? document.fonts.ready
        : Promise.resolve();

      fontesProntas.then(function () {
        return window.html2pdf().set({
          margin:   [10, 10, 12, 10],
          filename: 'retiro-unidos-cronograma.pdf',
          image:    { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: '#FFFFFF',
            windowWidth: 900,
            scrollY: 0
          },
          jsPDF:    { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['.ev', '.section-head'] }
        }).from(document.querySelector('.wrap')).save();
      }).then(function () {
        encerrarPdf(temaAtual);
      })['catch'](function () {
        encerrarPdf(temaAtual);
        falhou();
      });
    }, falhou);
  });

  /* ---------- tema ---------- */
  var btn = document.getElementById('themeBtn');

  function aplicarTema(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  var temaSalvo = null;
  try { temaSalvo = localStorage.getItem(THEME_KEY); } catch (e) {}
  aplicarTema(temaSalvo || (window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  btn.addEventListener('click', function () {
    aplicarTema(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>

(function () {
  'use strict';
  var ALVO = new Date('2026-08-21T18:00:00-03:00').getTime();
  var FIM  = new Date('2026-08-23T14:00:00-03:00').getTime();

  var box = document.getElementById('countdown');
  if (!box) return;

  var elD = document.getElementById('cdD'), elH = document.getElementById('cdH');
  var elM = document.getElementById('cdM'), elS = document.getElementById('cdS');
  var lead = document.getElementById('cdLead'), msg = document.getElementById('cdMsg');

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function plural(n, a, b) { return n === 1 ? a : b; }

  var timer = setInterval(tick, 1000);
  tick();

  function tick() {
    var agora = Date.now();
    var falta = ALVO - agora;

    if (falta <= 0) {
      box.classList.add('started');
      lead.textContent = agora < FIM ? 'Estamos no retiro' : 'Retiro Unidos';
      msg.textContent  = agora < FIM ? 'O retiro começou!' : 'Até o próximo!';
      clearInterval(timer);
      return;
    }

    var seg = Math.floor(falta / 1000);
    var d = Math.floor(seg / 86400);
    var h = Math.floor((seg % 86400) / 3600);
    var m = Math.floor((seg % 3600) / 60);
    var s = seg % 60;

    elD.textContent = pad(d);
    elH.textContent = pad(h);
    elM.textContent = pad(m);
    elS.textContent = pad(s);
    document.getElementById('cdLD').textContent = plural(d, 'dia', 'dias');
    document.getElementById('cdLH').textContent = plural(h, 'hora', 'horas');
    lead.textContent = d > 0 ? 'Faltam para o retiro' : 'É hoje!';
  }
})();
</script>
<script>
(function () {
  'use strict';
  var sky = document.getElementById('sky');
  if (!sky) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var EMOJIS = ['🙏','✨','🕊️','❤️','🎉','🔥','🤝','📖','🎸','⛺','🌿','😊','🌅','🤍','🎶','☀️'];
  var MAX = 12;

  function soltar() {
    if (document.hidden || sky.childElementCount >= MAX) return;
    var el = document.createElement('span');
    el.className = 'fly';
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    el.style.left = (Math.random() * 92 + 2) + '%';
    el.style.fontSize = (18 + Math.random() * 16) + 'px';
    el.style.animationDuration = (14 + Math.random() * 9) + 's';
    el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    el.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');
    el.addEventListener('animationend', function () { el.remove(); });
    sky.appendChild(el);
  }

  for (var i = 0; i < 4; i++) setTimeout(soltar, i * 900);
  setInterval(soltar, 1400);
})();
</script>
